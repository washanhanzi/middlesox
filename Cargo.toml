[workspace]
members = [
    "middlesox",
    "hyprland",
    "mangowc",
    "mock",
    "socket",
    "middlesox-cli",
    "middlesox-tests",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# The base crate
middlesox = { path = "middlesox" }
middlesox-mock = { path = "mock" }
middlesox-socket = { path = "socket" }
middlesox-mangowc = { path = "mangowc" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Scripting
rhai = { version = "1", features = ["sync"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
dirs = "6"
libc = "0.2"

# Testing
tempfile = "3"
