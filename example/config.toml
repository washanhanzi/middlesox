[adapter]
name = "mangowc"

[settings]
log_level = "debug"
scripts_dir = "scripts"

[settings.script_env]
MSX_WALLPAPER_DIR = "~/Pictures/active"
MSX_WALLPAPER_DELAY_SECONDS = "0.20"
MSX_WALLPAPER_TRANSITION = "fade"
MSX_WALLPAPER_TRANSITION_DURATION = "0.70"
MSX_WALLPAPER_TRANSITION_FPS = "60"

[[watch]]
event = "tag_change"
exec = "random_wallpaper.sh"
description = "Set a random wallpaper on the active output when workspace tags change"

[[watch]]
event = "layout_change"
exec = "layout_notify.sh"

[[watch]]
event = "focus_change"
exec = "keyd_appmap.sh"

[[watch]]
event = "output_focus"
exec = "keyd_appmap.sh"

[[command]]
name = "cycle_layout"
script = "cycle_layout.rhai"
description = "Cycle through Tile and Scroller layouts"
